---
# cspell:ignore equalto prefill rejectattr selectattr
- name: Load the items and the selectors of the tags matrix
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/include/tags-matrix-vars.yaml"
    name: meva_tags_matrix
- name: Run the tags matrix by nested runs
  ansible.builtin.command:
    argv: "{{ meva_tags_command + m.1 }}"
  vars:
    # jscpd:ignore-start
    meva_tags_command:
      - "{{ lookup('ansible.builtin.env', 'HOME') }}/bin/ansible-current.AppImage"
      - ansible-playbook
      - -i
      - "localhost," # DevSkim: ignore DS162092
      - -e
      - "ansible_python_interpreter={{ ansible_playbook_python }}"
      - -e
      - "meva_tags_place={{ m.0 }}"
      - "{{ playbook_dir }}/include/tags-matrix-play.yaml"
  # jscpd:ignore-end
  environment:
    ANSIBLE_LOG_PATH: /dev/null
    ANSIBLE_VERBOSITY: "0"
    ANSIBLE_STDOUT_CALLBACK: ansible.posix.json
  delegate_to: localhost # DevSkim: ignore DS162092
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  register: meva_tags_runs
  loop_control:
    loop_var: m
  loop: "{{ meva_tags_matrix.meva_tags_places |
    product(meva_tags_matrix.meva_tags_selectors) | list }}"
- name: Compare the wrapper items with the reference tasks
  ansible.builtin.assert:
    that:
      - meva_tags_runs.results[n].rc == 0
      - meva_tags_runs.results[n].m.1 | length > 0 or meva_tags_hits ==
        meva_tags_matrix.meva_getent | map(attribute='meva_key') | sort
      - meva_tags_module == meva_tags_hits
      - meva_tags_records == meva_tags_hits
      - meva_tags_reset == ('meva-tags-absent' in meva_tags_hits)
    fail_msg: "place {{ meva_tags_runs.results[n].m.0 }}, selector '{{
      meva_tags_runs.results[n].m.1 | join(' ') }}': rc {{
      meva_tags_runs.results[n].rc }}, module without reference {{ meva_tags_module |
      difference(meva_tags_hits) }},
      reference without module {{ meva_tags_hits | difference(meva_tags_module) }},
      record without reference {{ meva_tags_records | difference(meva_tags_hits) }},
      reference without record {{ meva_tags_hits | difference(meva_tags_records) }},
      reset {{ meva_tags_reset }}, reference of reset {{ 'meva-tags-absent' in
      meva_tags_hits }}, reference missed without selector {{
      (meva_tags_matrix.meva_getent | map(attribute='meva_key') |
      difference(meva_tags_hits)) if
      meva_tags_runs.results[n].m.1 | length == 0 else [] }}, stderr {{
      meva_tags_runs.results[n].stderr[-1000:] }}"
    quiet: true
  vars:
    meva_tags_host: "hosts.localhost" # DevSkim: ignore DS162092
    meva_tags_skipped: "{{ meva_tags_host }}.skipped"
    meva_tags_result: "{{ meva_tags_host }}.ansible_facts.meva_getent_results"
    meva_tags_tasks: "{{ ((meva_tags_runs.results[n].stdout | from_json).plays if
      meva_tags_runs.results[n].rc == 0 else []) | map(attribute='tasks') | flatten |
      selectattr(meva_tags_host, 'defined') | list }}"
    meva_tags_executed: "{{ (meva_tags_tasks |
      rejectattr(meva_tags_skipped, 'defined') | list) + (meva_tags_tasks |
      selectattr(meva_tags_skipped, 'defined') |
      rejectattr(meva_tags_skipped, 'true') | list) }}"
    meva_tags_module: "{{ meva_tags_executed | map(attribute='task.name') |
      select('search', 'Query meva-tags-[a-z-]+ getent entry$') |
      map('regex_replace', '^.*Query ', '') | map('replace', ' getent entry', '') |
      sort }}"
    meva_tags_hits: "{{ meva_tags_executed | map(attribute=meva_tags_host) |
      selectattr('msg', 'defined') | map(attribute='msg') | select('string') |
      select('match', 'HIT ') | map('replace', 'HIT ', '') | sort }}"
    meva_tags_lists: "{{ ((meva_tags_runs.results[n].stdout | from_json).plays if
      meva_tags_runs.results[n].rc == 0 else []) | map(attribute='tasks') | flatten |
      selectattr(meva_tags_result, 'defined') |
      map(attribute=meva_tags_result) | list }}"
    meva_tags_final: "{{ (meva_tags_lists | last if meva_tags_lists else
      meva_tags_matrix.meva_getent_results) | map(attribute='meva_key') | list }}"
    meva_tags_records: "{{ meva_tags_final | reject('equalto', 'meva-tags-prefill') |
      sort }}"
    meva_tags_reset: "{{ 'meva-tags-prefill' not in meva_tags_final }}"
  loop_control:
    loop_var: n
    label: "{{ meva_tags_runs.results[n].m.0 }} {{ meva_tags_runs.results[n].m.1 |
      join(' ') }}"
  loop: "{{ range(meva_tags_runs.results | length) | list }}"
