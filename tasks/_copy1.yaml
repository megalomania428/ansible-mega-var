---
- name: Upload some files
  ansible.builtin.copy:
    attributes: "{{ i.attributes | default(i.attr) | default(omit) }}"
    backup: "{{ i.backup | default(omit) }}"
    checksum: "{{ i.checksum | default(omit) }}"
    content: "{{ i.content | default(omit) }}"
    decrypt: "{{ i.decrypt | default(omit) }}"
    dest: "{{ i.dest | mandatory }}"
    directory_mode: "{{ i.directory_mode | default(omit) }}"
    follow: "{{ i.follow | default(omit) }}"
    force: "{{ i.force | default(omit) }}"
    group: "{{ i.group | default(omit) }}"
    local_follow: "{{ i.local_follow | default(omit) }}"
    mode: "{{ i.mode | default('0644') }}"
    owner: "{{ i.owner | default(omit) }}"
    remote_src: "{{ i.remote_src | default(omit) }}"
    selevel: "{{ f.dir_selevel | default(omit) }}"
    serole: "{{ f.dir_serole | default(omit) }}"
    setype: "{{ f.dir_setype | default(omit) }}"
    seuser: "{{ f.dir_seuser | default(omit) }}"
    src: "{{ i.src | default(omit) }}"
    unsafe_writes: "{{ i.unsafe_writes | default(omit) }}"
    validate: "{{ i.validate | default(omit) }}"
  register: _task_result
  when: "{{ _meva_cond_true if i.when is not defined else (i.when if i.when is string else
    (_meva_cond_true if i.when else _meva_cond_false)) }}" # noqa no-jinja-when
  tags: "{{ i.tags | default(omit) }}"
  diff: "{{ i.diff | default(omit) }}"
  notify: "{{ i.notify | default(omit) }}"
  timeout: "{{ i.timeout | default(omit) }}"
  check_mode: "{{ i.check_mode | default(omit) }}"
  failed_when: "{{ _meva_cond_failed if i.failed_when is not defined else (i.failed_when
    if i.failed_when is string else (_meva_cond_true if i.failed_when else
    _meva_cond_false)) }}"
  changed_when: "{{ _meva_cond_changed if i.changed_when is not defined else
    (i.changed_when if i.changed_when is string else (_meva_cond_true if i.changed_when
    else _meva_cond_false)) }}"
  ignore_errors: "{{ i.ignore_errors | default(false) }}"
  become: "{{ i.become | default(omit) }}"
  become_exe: "{{ i.become_exe | default(omit) }}"
  become_user: "{{ i.become_user | default(omit) }}"
  become_flags: "{{ i.become_flags | default(omit) }}"
  retries: "{{ i.retries | default(3 if 'until' in i else 0) }}"
  delay: "{{ i.delay | default(omit) }}"
  until: "{{ _meva_cond_success if i.until is not defined else (i.until if i.until is
    string else (_meva_cond_true if i.until else _meva_cond_false)) }}"
  async: "{{ i.async | default(omit) }}"
  poll: "{{ i.poll | default(omit) }}"
  no_log: "{{ i.no_log | default(omit) }}"
