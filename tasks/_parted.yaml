---
- name: Call module with each partition
  ansible.builtin.include_tasks: "{{ '_meva_reset.yaml' if i.meva_reset_here |
    default(false) else '_parted1r.yaml' if meva_results | bool else
    '_parted1.yaml' }}"
  vars:
    _meva_results_var: meva_parted_results
    _meva_list: "{{ meva_partitions }}"
    _meva_key: "{{ i.meva_key | default(_meva_censor if i.no_log | default(false) else
      i.device | default('undefined') ~ ((':' ~ i.number) if i.number is defined else
      '')) }}"
    _meva_name: "{{ i.meva_key | default(_meva_censor if i.no_log | default(false) else
      ((i.name ~ ' on ') if i.name is defined else '') ~ i.device | default('undefined') ~
      ((':' ~ i.number) if i.number is defined else '')) }}"
  loop_control:
    loop_var: i
    label: "{{ i.loop_label | default('meva_reset_here') if i.meva_reset_here |
      default(false) else '(censored due to no_log)' if i.no_log | default(false) else
      i.loop_label | default(i) }}"
  loop: "{{ _meva_loop }}"
