---
- name: Reset the meva_shell_results list
  ansible.builtin.set_fact:
    meva_shell_results: []
  when: meva_results | bool and meva_reset | bool
- name: Call module with each shell
  ansible.builtin.include_tasks: "{{ '_meva_reset.yaml' if i.meva_reset_here |
    default(false) else '_shell1.yaml' }}"
  vars:
    _meva_results_var: meva_shell_results
    _meva_key: "{{ i.meva_key | default(_meva_censor if i.no_log | default(false) else
      i.cmd | default(i.free_form) | default('undefined')) }}"
  loop_control:
    loop_var: i
    label: "{{ i.loop_label | default('meva_reset_here') if i.meva_reset_here |
      default(false) else '(censored due to no_log)' if i.no_log | default(false) else
      i.loop_label | default(i) }}"
  loop: "{{ meva_run4shell }}"
