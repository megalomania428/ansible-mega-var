---
- name: "Save the result into {{ _meva_results_var }}" # noqa name[template]
  ansible.builtin.set_fact:
    "{{ _meva_results_var }}": "{{ lookup('vars', _meva_results_var, default=[]) +
      [_meva_save_record | default(_meva_record)] }}" # noqa var-naming[no-jinja]
  when: i.meva_store | default(true) | bool
  tags: "{{ i.tags | default(omit) }}"
  no_log: "{{ i.no_log | default(omit) }}"
