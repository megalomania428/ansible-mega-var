---
- name: Call module with each command
  ansible.builtin.include_tasks: "{{ '_meva_reset.yaml' if i.meva_reset_here |
    default(false) else '_command1r.yaml' if meva_results | bool else
    '_command1.yaml' }}"
  vars:
    _meva_results_var: meva_command_results
    _meva_key: "{{ i.meva_key | default(_meva_censor if i.no_log | default(false) else
      i.cmd | default(i.argv | join(' ') if i.argv is defined else i.free_form) |
      default('undefined')) }}"
  loop_control:
    loop_var: i
    label: "{{ i.loop_label | default('meva_reset_here') if i.meva_reset_here |
      default(false) else '(censored due to no_log)' if i.no_log | default(false) else
      i.loop_label | default(i) }}"
  loop: "{{ ([{'meva_reset_here': true, 'loop_label': 'meva_reset'}] if meva_results |
    bool and meva_reset | bool else []) + meva_cmd2run }}" # DevSkim: ignore DS126858
