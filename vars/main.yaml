---
# cspell:ignore armv
meva_arch_map:
  i386: "i386"
  x86_64: "x64"
  aarch64: "arm64"
  armv7l: "arm"
meva_arch_bin: >-
  {{
    meva_arch_map[ansible_facts['architecture']] |
    default(ansible_facts['architecture'])
  }}
_meva_cond_true: "true"
_meva_cond_false: "false"
_meva_cond_failed: "_task_result.failed"
_meva_cond_changed: "_task_result.changed"
_meva_cond_rc: "_task_result.rc != 0"
_meva_cond_success: "_task_result is success"
_meva_cond_unit: "unit_check.rc == 0 or not ansible_check_mode"
_meva_censor: "(censored due to no_log)"
_meva_status: "{{ 'skipped' if _task_result is skipped else 'failed' if _task_result is
  failed else 'changed' if _task_result is changed else 'ok' }}"
_meva_record: "{{ {'meva_key': _meva_key, 'meva_status': _meva_status} if i.no_log |
  default(false) else _task_result | combine({'meva_key': _meva_key, 'meva_status':
  _meva_status}) }}"
